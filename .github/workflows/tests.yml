# Runs the test suite on every push to main, so GitHub shows a green check (or a red X) for each commit.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cache the voice and speech models (Kokoro from GitHub releases, faster-whisper from Hugging Face)
        uses: actions/cache@v4
        with:
          path: |
            assets/voice
            ~/.cache/huggingface
          key: models-kokoro-v1.0-whisper-base-v1
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
